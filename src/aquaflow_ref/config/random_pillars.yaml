# Fixed privileged map matching aquaflow_random_pillars.scn.
# Values are world_ned x/y coordinates and cylinder radii in metres.
# Pillar diameters are capped at 0.60 m and span down to 0.015 m.
robot_radius: 0.2
safety_margin: 0.2
corner_radius: 0.35
local_spacing: 0.20
pool_y_min: -3.8
pool_y_max: 3.8
pool_x_min: -7.0
pool_x_max: 7.0
pool_depth: 4.0
grid_resolution: 0.10
# Same exponential decay parameter used by costmap_2d-style inflation and
# by both the A* traversal cost and RViz heatmap colors.
cost_scaling_factor: 3.0
heatmap_max_clearance: 2.0
# Stonefish NED: pool floor's top surface is z=4.0 m. Keep the ESDF plane
# just above it to avoid z-fighting while rendering it on the pool bottom.
heatmap_z: 3.98
heatmap_alpha: 0.48
corner_radius: 0.35
# Keep the legacy rainbow heatmap off; the semantic MarkerArray palette below
# is the primary RViz visualization.
show_marker_heatmap: false
show_semantic_costmap: true
show_pool_walls: false
visual_cost_range: 0.80
global_goal: {x: 5.0, y: -2.0, z: 1.0}
goal_depth: 1.0
