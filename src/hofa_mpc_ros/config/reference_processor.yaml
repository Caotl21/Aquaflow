# Reference processor parameters
reference_topic: /aquaflow/teacher_global_path
lookahead_distance_m: 0.5
n_resample_points: 20
# The spatial window above is kept for PID.  MPC receives a separate
# time-indexed window below: point i corresponds to t + i * mpc_dt_s.
mpc_horizon_points: 20
mpc_dt_s: 0.1
max_speed: 0.35
max_yaw_rate: 0.5
max_accel_mps2: 0.12
max_decel_mps2: 0.18
s_backtrack_tolerance_m: 0.5
rate: 20.0
odom_timeout_s: 0.25
path_timeout_s: 2.0
