# BricsBot dynamics as seen in STONEFISH.  See vehicle_real.yaml for the
# physical robot; do not copy numbers between the two files.
vehicle:
  # Rigid-body inertia [m_x, m_y, I_z] for the current Stonefish scenario:
  # 0.50 kg hull + 7.44 kg ballast + 0.01 kg buoyancy = 7.95 kg.
  # Dry yaw inertia is a thin-shell/box geometric estimate, not a measurement.
  dry_mass: [7.95, 7.95, 0.174887]
  # Hull MVAE converged after 21 iterations with the pre-refined, normal-free
  # mesh. The compound averages the hull translational added masses
  # (5.734912, 19.295300, 53.731838) to 26.254017 kg.
  # Yaw is an effective 3-DOF identification: 0.24254 - 0.174887 kg.m^2.
  added_mass: [26.254017, 26.254017, 0.067653]
  coriolis_enabled: false
  # Steady-state force/torque sweeps and held-out transient validation:
  # results/identification/{surge,sway,yaw}_mvae50_*/validation_report.md
  drag_linear: [35.488892, 35.656137, 1.163915]
  drag_quadratic: [17.853671, 17.584671, 0.021297]

# Horizontal thrusters T1-T4 (matching hand-drawn diagram and actual hardware)
thrusters:
  count: 4
  positions_xy:
    - [ 0.12755, -0.12755]   # T1 right-front
    - [ 0.12755,  0.12755]   # T2 left-front
    - [-0.12755, -0.12755]   # T3 right-rear
    - [-0.12755,  0.12755]   # T4 left-rear
  directions_xy:
    - [ 0.7071,  0.7071]   # T1    45° (forward + right)
    - [ 0.7071, -0.7071]   # T2   -45° (forward + left)
    - [-0.7071,  0.7071]   # T3   135° (backward + right)
    - [-0.7071, -0.7071]   # T4  -135° (backward + left)
  thrust_max: [67.67, 67.67, 67.67, 67.67]    # N (positive direction, from 26V sheet)
  thrust_min: [-58.84, -58.84, -58.84, -58.84] # N (negative direction, from 26V sheet)
  time_constant_s: 0.10
  deadzone_n: 0.15

# Generalized force scale (for parameter mismatch experiments)
generalized_force_scale:
  x_positive: 1.0
  x_negative: 1.0
  y_positive: 1.0
  y_negative: 1.0
  yaw_positive: 1.0
  yaw_negative: 1.0
