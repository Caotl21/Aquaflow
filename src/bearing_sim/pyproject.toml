[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bearing-sim"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
ml = ["torch>=2.2,<3"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["bearing_sim*"]
